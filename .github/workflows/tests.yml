name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Validate lessons and TypeScript
        run: |
          npm run validate:lessons
          npm run typecheck
          npm run test:ts

      - name: Run CI Checks
        run: composer ci:check

      # Click-through of every lesson in /dev/playground, plus the feature specs
      # (tests/e2e/features.spec.ts) that log in as accounts made by
      # chessflow:e2e-fixtures, which needs the lessons in the database. Uses the
      # Google Chrome preinstalled on the runner (playwright.config.ts: channel
      # 'chrome'); assets come from the `npm run build` done by composer setup.
      - name: E2E (Playwright)
        run: |
          php artisan config:clear
          php artisan chessflow:import-lessons
          npm run test:e2e
